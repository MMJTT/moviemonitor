x-app-environment: &app-environment
  TICKETWATCH_ENV: ${TICKETWATCH_ENV:-production}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  WORKER_SCAN_SECONDS: ${WORKER_SCAN_SECONDS:-10}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
  AGENT_MAIL_REVERIFY_SECONDS: ${AGENT_MAIL_REVERIFY_SECONDS:-21600}
  AGENT_MAIL_ATTESTATION_TTL_SECONDS: ${AGENT_MAIL_ATTESTATION_TTL_SECONDS:-86400}
  AGENT_MAIL_CLAIM_SECONDS: ${AGENT_MAIL_CLAIM_SECONDS:-120}

services:
  web:
    build:
      context: .
      target: web
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      AGENTLY_WORKSPACE: ${AGENTLY_WORKSPACE:-ticketwatch-server}
      AGENTLY_KEYRING_PASSWORD: ${AGENTLY_KEYRING_PASSWORD:?AGENTLY_KEYRING_PASSWORD is required}
    volumes:
      - type: bind
        source: ${AGENTLY_DATA_DIR:-../data/agently}
        target: /home/ticketwatch
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-bookworm
    command:
      - postgres
      - -c
      - max_connections=20
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-../data/postgres}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:-../data/redis}
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
