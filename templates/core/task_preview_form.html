{% extends "base.html" %}

{% block title %}新建监控任务 · TicketWatch{% endblock %}

{% block content %}
  <header class="page-heading split-heading">
    <div>
      <p class="eyebrow">New screening watch</p>
      <h1>新建监控任务</h1>
    </div>
    <p>选择城市并粘贴包含 movieId 和 showDate 的猫眼影院列表 HTTPS 链接。</p>
  </header>
  <section class="form-layout">
    <aside class="form-context steps-context" aria-label="创建步骤">
      <ol><li class="is-active"><span>01</span>填写目标</li><li><span>02</span>选择影院</li><li><span>03</span>开始监控</li></ol>
    </aside>
    <div class="form-card">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="button-primary" type="submit">预览影院</button>
    </form>
    </div>
  </section>
{% endblock %}
