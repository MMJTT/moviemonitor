<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <title>SMTP 配置</title>
  </head>
  <body>
    <h1>SMTP 配置</h1>
    {% if config.is_verified %}
      <p>SMTP 已验证</p>
    {% else %}
      <p>SMTP 尚未验证</p>
    {% endif %}
    {% if config.verified_at %}
      <p>最近验证时间：{{ config.verified_at }}</p>
    {% endif %}
    {% if config.last_error %}
      <p role="alert">{{ config.last_error }}</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">保存并发送测试邮件</button>
    </form>
    <form method="post" action="{% url 'core:smtp-test' %}">
      {% csrf_token %}
      <button type="submit">重新发送测试邮件</button>
    </form>
  </body>
</html>
