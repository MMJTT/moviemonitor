{% load static %}
<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#171816" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)">
    <title>{% block title %}TicketWatch{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{% url 'core:dashboard' %}" aria-label="TicketWatch 首页">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span class="brand-copy"><strong>TicketWatch</strong><small>本地开票监控</small></span>
        </a>
        <nav class="primary-nav" aria-label="主导航">
          <a href="{% url 'core:dashboard' %}"{% if request.resolver_match.url_name == "dashboard" or request.resolver_match.url_name == "task-detail" %} aria-current="page"{% endif %}>仪表盘</a>
          <a href="{% url 'core:task-preview' %}"{% if request.resolver_match.url_name == "task-preview" or request.resolver_match.url_name == "task-confirm" %} aria-current="page"{% endif %}>新建任务</a>
          <a href="{% url 'core:smtp-edit' %}"{% if request.resolver_match.url_name == "smtp-edit" %} aria-current="page"{% endif %}>SMTP</a>
          <a href="{% url 'core:settings' %}"{% if request.resolver_match.url_name == "settings" %} aria-current="page"{% endif %}>设置</a>
        </nav>
      </div>
    </header>
    <main class="shell page-stack" id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="shell site-footer">
      <span class="local-indicator"><i aria-hidden="true"></i>本地服务运行中</span>
      <p>127.0.0.1&nbsp;&nbsp;/&nbsp;&nbsp;关闭终端进程会停止监控</p>
    </footer>
  </body>
</html>
